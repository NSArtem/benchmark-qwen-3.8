[project]
name = "qwen38"
version = "0.1.0"
description = "Serialized Qwen3.8-27B MLX runtime: exact-suffix persistent chat CLI and OpenAI-compatible agent server"
requires-python = "==3.14.*"
# Exact pins are part of the validated runtime; do not upgrade casually.
# mlx-lm reports metadata version 0.31.3 at this commit.
dependencies = [
    "mlx==0.32.1",
    "mlx-lm @ git+https://github.com/ml-explore/mlx-lm.git@254d153fdeb6f150edd4fc5a54f9828638481fa8",
]

[project.scripts]
qwen38-chat = "qwen38.chat:main"
qwen38-server = "qwen38.server:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
